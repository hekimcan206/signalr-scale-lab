<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="What each topology delivers"><style>svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e6e5e0;--axis:#a3a29c;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4}@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#33332f;--axis:#6b6a64;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181}}text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--ink2);font-size:12px}.t{fill:var(--ink);font-size:16px;font-weight:600}.st{font-size:12px}.lab{fill:var(--ink);font-size:12px}.g{stroke:var(--grid);stroke-width:1}.ax{stroke:var(--axis);stroke-width:1}</style><rect width="760" height="420" fill="var(--surface)"/><text class="t" x="24" y="28">What each topology delivers</text><text class="st" x="24" y="47">Largest stage: 10,000 connection attempts per scenario, median of runs. Docker Desktop VM (16 CPU, 7.6 GB) on a shared</text><text class="st" x="24" y="62">Windows host; hubs 2 CPU each.</text><rect x="24" y="76" width="12" height="12" rx="3" fill="var(--s1)"/><text x="41" y="86">connections that opened</text><rect x="206.2" y="76" width="12" height="12" rx="3" fill="var(--s3)"/><text x="223.2" y="86">broadcast receives / connected clients</text><line class="g" x1="72" x2="736" y1="364" y2="364"/><text x="64" y="368" text-anchor="end">0</text><line class="g" x1="72" x2="736" y1="315.2" y2="315.2"/><text x="64" y="319.2" text-anchor="end">20</text><line class="g" x1="72" x2="736" y1="266.4" y2="266.4"/><text x="64" y="270.4" text-anchor="end">40</text><line class="g" x1="72" x2="736" y1="217.6" y2="217.6"/><text x="64" y="221.6" text-anchor="end">60</text><line class="g" x1="72" x2="736" y1="168.8" y2="168.8"/><text x="64" y="172.8" text-anchor="end">80</text><line class="g" x1="72" x2="736" y1="120" y2="120"/><text x="64" y="124" text-anchor="end">100</text><text x="16" y