<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Broadcast latency, median"><style>svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e6e5e0;--axis:#a3a29c;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4}@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#33332f;--axis:#6b6a64;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181}}text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--ink2);font-size:12px}.t{fill:var(--ink);font-size:16px;font-weight:600}.st{font-size:12px}.lab{fill:var(--ink);font-size:12px}.g{stroke:var(--grid);stroke-width:1}.ax{stroke:var(--axis);stroke-width:1}</style><rect width="760" height="420" fill="var(--surface)"/><text class="t" x="24" y="28">Broadcast latency, median</text><text class="st" x="24" y="47">Send request to arrival at a client, p50 over all receives, median of runs. Synthetic test data.</text><rect x="24" y="76" width="12" height="12" rx="3" fill="var(--s1)"/><text x="41" y="86">single</text><rect x="97.4" y="76" width="12" height="12" rx="3" fill="var(--s2)"/><text x="114.4" y="86">sticky-only</text><rect x="202.8" y="76" width="12" height="12" rx="3" fill="var(--s3)"/><text x="219.8" y="86">sticky-redis</text><rect x="314.6" y="76" width="12" height="12" rx="3" fill="var(--s4)"/><text x="331.6" y="86">rr-skip</text><line class="g" x1="72" x2="560" y1="364" y2="364"/><text x="64" y="368" text-anchor="end">0</text><line class="g" x1="72" x2="560" y1="298" y2="298"/><text x="64" y="302" text-anchor="end">2</text><line class="g" x1="72" x2="560" y1="232" y2="232"/><text x="64" y="236" text-anchor="end">4</text><line class="g" x1="72" x2="560" y1="166" y2="166"/><text x="64" y="170" text-anchor="end">6</text><line class="g" x1="72" x2="560" y1="100" y2="100"/><text x="64" y="104" text-anchor="end">8</text><text x="72" y="382" text-anchor="middle">0</text><text x="194" y="382" text-anchor="middle">500</text><text x="316" y="382" text-anchor="middle">1,000</text><text x="438" y="382" text-anchor="middle">1,500</text><text x="560" y="382" text-anchor="middle">2,000</text><line class="ax" x1="72" x2="560" y1="364" y2="364"/><text x="316" y="408" text-anchor="middle">open connections</text><text x="16" y="232" text-anchor="middle" transform="rotate(-90 16 232)">milliseconds</text><path d="M316,265 L560,166" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="316" cy="265" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>single: 3 at 1,000</title></circle><circle cx="560" cy="166" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>single: 6 at 2,000</title></circle><path d="M316,255.1 L560,146.2" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="316" cy="255.1" r="4.5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>sticky-only: 3.3 at 1,000</title></circle><circle cx="560" cy="146.2" r="4.5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>sticky-only: 6.6 at 2,000</title></circle><path d="M316,265 L560,166" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="316" cy="265" r="4.5" fill="var(--s3)" stroke="var(--surface)" stroke-width="2"><title>sticky-redis: 3 at 1,000</title></circle><circle cx="560" cy="166" r="4.5" fill="var(--s3)" stroke="var(--surface)" stroke-width="2"><title>sticky-redis: 6 at 2,000</title></circle><path d="M316,260 L560,156.1" fill="none" stroke="var(--s4)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="316" cy="260" r="4.5" fill="var(--s4)" stroke="var(--surface)" stroke-width="2"><title>rr-skip: 3.2 at 1,000</title></circle><circle cx="560" cy="156.1" r="4.5" fill="var(--s4)" stroke="var(--surface)" stroke-width="2"><title>rr-skip: