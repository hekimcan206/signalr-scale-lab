name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # Package versions are pinned and updated by hand, so a known vulnerability in any direct or
      # transitive package fails the build. Fix it with a pinned upgrade in Directory.Packages.props.
      - name: Audit for vulnerable packages
        run: |
          set -o pipefail
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable-packages.txt
          if grep -q "has the following vulnerable packages" vulnerable-packages.txt; then
            echo "::error::Known-vulnerable NuGet packages found (see the list above)"
            exit 1
          fi

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore --configuration Release

      # Unit, property and golden tests, then integration tests: Redis starts through Testcontainers on the runner's
      # Docker engine; two hub servers and the YARP proxy run in-process on real sockets.
      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --coverage --coverage-output-format cobertura
          --results-directory "${{ github.workspace }}/TestResults"

      - name: Coverage summary
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.12
        with:
          reports: TestResults/**/*.cobertura.xml
          targetdir: coverage
          reporttypes: MarkdownSummaryGithub
          assemblyfilters: "-*Tests*"
          filefilters: "-*/obj/*"

      - name: Publish coverage to job summary
        if: always()
        run: |
          if [ -f coverage/SummaryGithub.md ]; then
            cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage report produced."
          fi

      # The committed charts and summary are a pure function of the committed run files: regenerating them must not
      # change a byte, so nobody can edit a number by hand.
      - name: Committed report matches the committed measurements
        run: |
          dotnet run --no-build --configuration Release --project src/ScaleLab.LoadGen -- report \
            --env "$(cat benchmark-results/environment.txt)"
          git diff --exit-code -- docs/images benchmark-results/summary.md

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: TestResults/
          retention-days: 7

  container:
    name: container images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build images
        run: |
          for target in hub proxy loadgen; do
            docker buildx build --target "$target" --load \
              --cache-from type=gha,scope=signalr-scale-lab --cache-to type=gha,mode=max,scope=signalr-scale-lab \
              -t "signalr-scale-lab-$target:ci" .
          done

      - name: Verify every image runs as non-root
        run: |
          for target in hub proxy loadgen; do
            user=$(docker image inspect "signalr-scale-lab-$target:ci" --format '{{.Config.User}}')
            echo "signalr-scale-lab-$target user: ${user}"
            test -n "${user}" && test "${user}" != "0" && test "${user}" != "root"
          done

  compose-demo:
    name: docker compose demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The README promises `docker compose up` runs the whole demo with zero manual steps; this job keeps it true.
      - name: Start the stack
        run: docker compose up -d --build

      - name: Every topology behaves as expected
        run: |
          code=$(docker wait signalr-scale-lab-loadgen-1)
          docker compose logs --no-log-prefix loadgen | tee demo.log
          test "${code}" = "0"
          grep -q '"allAsExpected":true' demo.log
          grep -Eq '^sticky-only .* 3[0-9]\.[0-9]%' demo.log
          grep -Eq '^sticky-redis +300/300 +100\.0%' demo.log

      - name: The API is protected and the stats endpoint answers with the key
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:58481/api/stats)" = "401"
          curl -fsS -H 'X-Lab-Key: lab-dev-only' http://127.0.0.1:58481/api/stats | tee stats.json
          grep -q '"backplane":true' stats.json
          curl -fsS http://127.0.0.1:58480/healthz

      # A short bench run keeps the measurement path working: two stages, a few broadcasts, through the sticky route.
      - name: Bench smoke run
        run: |
          docker compose run --rm -T loadgen bench --scenario sticky-redis --stages 200,400 --messages 5 --rate 10 \
            --settle 1 --drain 3 > bench.json
          grep -q '"connected": 400' bench.json
          grep -q '"deliveryRatio": 1' bench.json

      - name: Logs on failure
        if: failure()
        run: docker compose logs
